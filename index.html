<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPR 2026 Assessment Dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --border: rgba(11,11,11,0.10);
  --text-primary: #0b0b0b; --text-secondary: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --accent: #1c5cab; --chip: #eef4fc;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --border: rgba(255,255,255,0.10);
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --grid: #2c2c2a; --axis: #383835;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --accent: #6da7ec; --chip: #1c2a3d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --border: rgba(255,255,255,0.10);
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --grid: #2c2c2a; --axis: #383835;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --accent: #6da7ec; --chip: #1c2a3d;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root { max-width: 1280px; margin: 0 auto; padding: 16px; }
h1 { font-size: 22px; margin: 0; }
h2 { font-size: 17px; margin: 24px 0 8px; }
h3 { font-size: 14px; margin: 0 0 8px; color: var(--text-secondary); font-weight: 600; }
.sub, .muted { color: var(--text-secondary); margin: 2px 0 0; }
.muted { font-size: 12px; }
.top { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
.titlebox { text-align: center; }
.status { justify-content: flex-end; margin-top: 8px; }
.status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button { font: inherit; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
.badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--chip); color: var(--accent); }
.badge.demo { background: var(--warning); color: #0b0b0b; }
.banner { margin: 12px 0; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface-1); border-left: 4px solid var(--warning); }
.banner.error { border-left-color: var(--critical); }
.tabs { display: flex; gap: 4px; margin: 16px 0 0; border-bottom: 1px solid var(--grid); overflow-x: auto; }
.tabs button { border: none; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 10px 14px;
  color: var(--text-secondary); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 600; }
.filters { display: flex; gap: 16px; flex-wrap: wrap; padding: 12px 0; }
.filters label { display: flex; flex-direction: column; font-size: 12px; color: var(--text-secondary); gap: 4px; }
select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); min-width: 180px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.kpi .v { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--text-secondary); font-size: 12px; }
.kpi .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px; min-width: 0; }
.card .chart { position: relative; height: 280px; }
.card .chart.tall { height: 380px; }
.card p.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--text-secondary); font-weight: 600; position: sticky; top: 0; background: var(--surface-1); }
td.num, th.num { text-align: right; }
.tablewrap { max-height: 520px; overflow: auto; }
.st { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.st.good::before { background: var(--good); } .st.warning::before { background: var(--warning); }
.st.critical::before { background: var(--critical); } .st.serious::before { background: var(--serious); }
.flag { color: var(--text-primary); }
.empty { color: var(--muted); padding: 24px; text-align: center; }
details summary { cursor: pointer; color: var(--accent); margin-top: 8px; font-size: 12px; }
footer { margin: 32px 0 8px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } select { min-width: 140px; } }

.filters { align-items: flex-end; }
.filters select { min-width: 150px; max-width: 240px; }
button.clear { height: 34px; }
.profile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.profile:empty { display: none; }
.profile h2 { margin: 0 0 8px; font-size: 16px; }
.profile dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 16px; margin: 0; }
.profile dt { font-size: 12px; color: var(--text-secondary); }
.profile dd { margin: 0; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--chip); color: var(--text-primary); }
.chipgroup { margin: 4px 0; }
.chipgroup b { font-size: 12px; color: var(--text-secondary); font-weight: 600; margin-right: 6px; }


.logo { display: block; width: auto; background: #ffffff; border-radius: 10px; padding: 6px 10px; }
.logo-moh { height: 64px; }
.logo-nascop { height: 60px; }
@media (max-width: 700px) {
  .top { grid-template-columns: 1fr 1fr; }
  .titlebox { grid-column: 1 / -1; grid-row: 2; }
  .logo-nascop { justify-self: end; }
  .logo-moh, .logo-nascop { height: 44px; }
  .status { justify-content: flex-start; }
}
/* login */
.login { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: var(--page); }
.login[hidden] { display: none; }
.login-card { width: 100%; max-width: 420px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); }
.login-card h1 { text-align: center; font-size: 20px; }
.login-card .sub { text-align: center; margin-top: -6px; }
.login-card .muted { text-align: center; margin-top: 8px; }
.login-logos { display: flex; justify-content: space-between; align-items: center; background: #ffffff; border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; }
.login-logos img { height: 52px; width: auto; }
.login-logos .logo-nascop { height: 46px; }
.login-card label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
.pwrow { display: flex; gap: 6px; }
.pwrow input { flex: 1; font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--page); color: var(--text-primary); }
.pwrow input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); font-weight: 600; padding: 10px; }
button.primary:disabled { opacity: 0.6; cursor: wait; }
.login-error { color: var(--critical); font-size: 13px; min-height: 18px; margin: 0; }

/* frozen top: logos, title, status, tabs and filters stay visible while scrolling */
@media (min-width: 701px) {
  .sticky-top { position: sticky; top: 0; z-index: 5; background: var(--page); padding-top: 8px; margin-top: -8px;
    box-shadow: 0 6px 8px -8px rgba(0,0,0,0.25); }
  .sticky-top .logo-moh { height: 54px; } .sticky-top .logo-nascop { height: 50px; }
}

.pwgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.pwgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-secondary); }
.pwgrid input { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--page); color: var(--text-primary); }
.npout { width: 100%; height: 90px; margin-top: 8px; font: 12px Consolas, monospace; border-radius: 8px; border: 1px solid var(--border); background: var(--page); color: var(--text-primary); padding: 8px; }

.sources { text-align: right; font-size: 12.5px; margin-top: 4px; }
.sources .src-bad { color: var(--danger, #b42318); }
@media (max-width: 700px) { .sources { text-align: left; } }

.kmbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.kmbar select { margin-left: 6px; }

.segbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 12px; }
.segbar button { border: 1px solid var(--border, #d0d5dd); background: var(--surface-1, #fff); color: inherit; padding: 7px 14px; border-radius: 999px; cursor: pointer; font: inherit; }
.segbar button[aria-selected="true"] { background: var(--s1); border-color: var(--s1); color: #fff; font-weight: 600; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--s1); cursor: pointer; font: inherit; text-decoration: underline; }
.linkbtn.on { font-weight: 700; text-decoration: none; }

</style>

<script>
/* DPR 2026 Integration Assessment Dashboard
   Reads ODK submissions from Google Sheets (CSV), never displays client identifiers. */
(function () {
  "use strict";
  const CFG = window.DPR_CONFIG, CODES = window.DPR_CODES, SITES = window.DPR_SITES;
  const SITE = Object.fromEntries(SITES.map(s => [s.id, s]));
  const FORMS = { hf: "Health Facility", pl: "Patient-Level", kii: "KII" };
  const PRIVATE = new Set(["roc_id", "dob", "devicephonenum", "phonenumber", "username", "data_collector_id"]);
  let RAW = { hf: [], pl: [], kii: [] }, DEMO = false, charts = {}, activeTab = "progress";

  // ---------------------------------------------------------------- utils
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const SER = () => ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"].map(css);
  const pct = (n, d) => d ? Math.round(1000 * n / d) / 10 : null;
  const fmtPct = (n, d) => d ? `${pct(n, d)}% (${n}/${d})` : "–";
  const num = v => (v === "" || v == null || isNaN(+v)) ? null : +v;
  const median = a => { const b = a.filter(x => x != null).sort((x, y) => x - y); if (!b.length) return null; const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
  const label = (form, v, code) => {
    const def = CODES[form].vars[v]; if (!def) return code;
    return CODES[form].lists[def.list]?.[code] ?? code;
  };
  const sel = (val, code) => String(val ?? "").split(" ").includes(code);
  const countBy = (rows, f) => rows.reduce((m, r) => { const k = f(r); if (k != null && k !== "") m[k] = (m[k] || 0) + 1; return m; }, {});
  const countMulti = (form, rows, v) => {
    const out = {}; rows.forEach(r => String(r[v] ?? "").split(" ").filter(Boolean).forEach(c => out[c] = (out[c] || 0) + 1));
    return Object.entries(out).map(([c, n]) => [label(form, v, c), n]).sort((a, b) => b[1] - a[1]);
  };

  // ---------------------------------------------------------------- loading
  function csvUrl(form) {
    if (CFG.csvUrls?.[form]) return CFG.csvUrls[form];
    return `https://docs.google.com/spreadsheets/d/${CFG.sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(CFG.tabs[form])}`;
  }
  /** dd/mm/yyyy, d/m/yyyy or yyyy-mm-dd(Thh:mm) → yyyy-mm-dd */
  function isoDate(v) {
    v = String(v || "").trim(); const m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
    return m ? `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` : v.slice(0, 10);
  }
  function normalise(form, rows) {
    if (!rows.length) return [];
    const map = {}, seen = new Set();                   // header → variable (last path segment), first occurrence wins
    const EMR = window.DPR_EMR_MAP || {};
    Object.keys(rows[0]).forEach(h => {                // EMR extract headers first, then ODK/Kobo paths
      const k = EMR[h.trim()] || h.split(/[\/\-:]/).pop().trim();
      if (k && !seen.has(k)) { seen.add(k); map[h] = k; } });
    const rev = {};                                     // label → code, for label-style exports
    Object.entries(CODES[form].vars).forEach(([v, d]) => {
      rev[v] = Object.fromEntries(Object.entries(CODES[form].lists[d.list] || {}).map(([c, l]) => [l.toLowerCase(), c]));
    });
    return rows.map(r => {
      const o = {};
      for (const [h, k] of Object.entries(map)) {
        if (PRIVATE.has(k)) continue;                   // drop identifiers on load
        let v = r[h]; v = v == null ? "" : String(v).trim();
        if (rev[k] && v && rev[k][v.toLowerCase()]) v = rev[k][v.toLowerCase()];
        o[k] = v;
      }
      o._site = o.site_id || o.facility || "";
      o._date = isoDate(o.assess_date || o.collection_date || o.today || o.start || "");
      return o;
    }).filter(o => Object.values(o).some(v => v !== "") && o._site !== "Site ID" && o._site !== "site_id");   // skip blank / repeated header rows
  }
  async function loadAll() {
    const live = CFG.sheetId || Object.values(CFG.csvUrls || {}).some(Boolean);
    if (!live) { RAW = demoData(); DEMO = true; return; }
    DEMO = false;
    const errs = [];
    await Promise.all(Object.keys(FORMS).map(async f => {
      if (!CFG.csvUrls?.[f] && !CFG.tabs[f]) { RAW[f] = []; return; }   // form not used
      try {
        const res = await fetch(csvUrl(f), { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        if (/^\s*</.test(text)) throw new Error("not shared publicly (got a sign-in page)");
        const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
        RAW[f] = normalise(f, parsed.data);
      } catch (e) { RAW[f] = []; errs.push(`${FORMS[f]} (tab "${CFG.tabs[f]}"): ${e.message}`); }
    }));
    if (CFG.tabs.pl_emr || CFG.csvUrls?.pl_emr) {           // EMR extract tab → added to patient-level records
      try {
        const url = CFG.csvUrls?.pl_emr || `https://docs.google.com/spreadsheets/d/${CFG.sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(CFG.tabs.pl_emr)}`;
        const text = await (await fetch(url, { cache: "no-store" })).text();
        const rows = normalise("pl", Papa.parse(text, { header: true, skipEmptyLines: true }).data).filter(r => r.site_id !== "Site ID").map(r => ({ ...r, _source: "EMR" }));   // skip header rows left by manual appends
        if (!/Care status \(6m\)|RoC ID \(CCC\)/.test(text.split("\n")[0])) throw new Error("tab not found or not in the EMR extract format");
        RAW.pl = RAW.pl.map(r => ({ ...r, _source: r._source || "ODK" })).concat(rows);
      } catch (e) { errs.push(`EMR extract (tab "${CFG.tabs.pl_emr}"): ${e.message}`); }
    }
    if (errs.length) banner(`Some data could not be loaded – ${errs.join("; ")}. Check the tab names in config.js and that the sheet is shared "Anyone with the link – Viewer".`, true);
  }

  // ---------------------------------------------------------------- HF facility data → patient records (MFL code)
  /** Facility fields from the HF assessment carried on every patient record (hf_… columns written by the sync
   *  script). If the sheet does not have them yet, the same link is made here from the HF tab, on the MFL code. */
  const HF_LINK = { hf_assess_date: "assess_date", hf_facility_name: "facility_name", hf_ownership: "ownership", hf_keph_level: "keph_level",
    hf_ext_support: "a9", hf_transition_changes: "a10", hf_clients_on_art: "a12", hf_integration_date: "b6",
    hf_eligibility: "eligibility", hf_integration_model: "b15", hf_linkage_model: "b21", hf_funding: "b28" };
  const mflKey = v => String(v || "").replace(/\D/g, "").replace(/^0+/, "");
  function linkHfToPatients() {
    const latest = (rows, key) => { const m = {}; rows.slice().sort((a, b) => String(a._date).localeCompare(String(b._date)))
      .forEach(r => { const k = key(r); if (k) m[k] = r; }); return m; };
    const hfByMfl = latest(RAW.hf, r => mflKey(r.mfl_code)), hfBySite = latest(RAW.hf, r => r._site);
    const siteByMfl = {};
    SITES.forEach(s => { if (mflKey(s.mfl)) siteByMfl[mflKey(s.mfl)] = s.id; });
    RAW.hf.forEach(r => { if (mflKey(r.mfl_code) && SITE[r._site]) siteByMfl[mflKey(r.mfl_code)] = r._site; });
    RAW.pl.forEach(r => {
      const m = mflKey(r.mfl_code);
      if (!SITE[r._site] && siteByMfl[m]) r._site = siteByMfl[m];               // EMR row with only an MFL code
      if (r.hf_matched_on && r.hf_matched_on !== "no HF assessment yet") { r._hf = r.hf_matched_on; return; }  // linked by the sync script
      const h = (m && hfByMfl[m]) || hfBySite[r._site];
      if (!h) { r._hf = ""; return; }
      r._hf = m && hfByMfl[m] ? "MFL code" : "site ID";
      Object.entries(HF_LINK).forEach(([k, v]) => { if (!r[k]) r[k] = h[v] ?? ""; });
    });
  }

  // ---------------------------------------------------------------- demo data
  function demoData() {
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const pick = a => a[Math.floor(rnd() * a.length)];
    const day = i => { const d = new Date(2026, 10, 3 + i); return d.toISOString().slice(0, 10); };
    const hf = [], pl = [], kii = [];
    SITES.filter(s => s.type === "selected").forEach((s, i) => {
      if (rnd() < 0.15) return;                         // some sites not yet visited

      <h3>Definitions</h3><ul>
      <li><b>ART delivery model (B15)</b> – Stand-alone: no general service point delivers ART. Fully integrated: stand-alone clinic no longer delivers initiation and refills (or &lt;10% of clients), ART at ≥1 general point, not dedicated HIV staff only, fully shared flow and a single integrated record. Otherwise partially integrated.</li>
      <li><b>Eligibility</b> – agreed integration date (B6) between 07/2024 and 03/2025, as set in the HF form.</li>
      <li><b>Pilot sites</b> – Nairobi (Kibra CHC, Kware Dispensary) was the pilot county. Pilot sites are excluded from all figures by default; use the "Pilot sites" filter to include them or view them alone.</li>
      <li><b>Cohorts</b> – 12-month: ART start June–September 2025; 24-month: June–September 2024.</li>
      <li><b>Active on ART</b> – care status = "Alive and active on ART" at the follow-up point, among records with a documented status (excludes "Not documented").</li>
      <li><b>VL coverage</b> – VL done among those active at the point. <b>VL suppression</b> – result &lt;200 copies/mL among records with a result.</li>
      <li><b>AHD</b> – baseline CD4 &lt;200 or age &lt;5 at ART initiation.</li>
      <li><b>Red flags</b> – integration date outside window; facility appears stand-alone; &lt;15 new initiations in a cohort window; reserve site used.</li></ul></div>`;

  }

  // ---------------------------------------------------------------- shell
  function banner(msg, err) { const b = $("#banner"); b.hidden = !msg; b.className = "banner" + (err ? " error" : ""); b.innerHTML = msg || ""; }
  /** Warn when the sheet has no ODK Central submissions yet. */
  function renderSources() {
    const odkPl = RAW.pl.filter(r => (r.data_source || r._source) !== "EMR").length;
    if (!DEMO && !RAW.hf.length && !odkPl && !RAW.kii.length)
      banner("No ODK Central submissions are in the Google Sheet yet. In the sheet, run <b>DPR sync → 2. Test login</b>, then <b>3. Sync now</b>, and check the <b>_sync_log</b> tab.", true);
  }
  function render() {
    const D = filtered();
    renderProfile(D);
    ({ progress: renderProgress, facility: renderFacility, patients: renderPatients, kii: renderKII, dq: renderDQ, about: renderAbout })[activeTab](D);
  }
  async function refresh() {
    $("#reload").disabled = true; $("#updated").textContent = "Loading…";
    await loadAll();
    linkHfToPatients();
    $("#mode-badge").textContent = DEMO ? "DEMO DATA" : "Live data"; $("#mode-badge").className = "badge" + (DEMO ? " demo" : "");
    if (DEMO) banner("Demo mode: the numbers below are made up. Put your Google Sheet ID in <code>config.js</code> to show the real assessment data.");
    $("#updated").textContent = `Updated ${new Date().toLocaleString()}`; $("#reload").disabled = false;
    renderSources();
    render();
  }
  function init() {
    document.title = CFG.title + " Dashboard"; $("#title").textContent = CFG.title;
    CFG.counties.forEach(c => $("#f-county").insertAdjacentHTML("beforeend", `<option>${esc(c)}</option>`));
    document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
      document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
      activeTab = b.dataset.tab; document.querySelectorAll(".tab").forEach(t => t.hidden = t.id !== "tab-" + activeTab); render();
    }));
    Object.entries(LEVELS).filter(([k]) => k !== "other").forEach(([k, l]) => $("#f-level").insertAdjacentHTML("beforeend", `<option value="${k}">${esc(l)}</option>`));
    Object.entries(OWNS).forEach(([k, l]) => $("#f-own").insertAdjacentHTML("beforeend", `<option value="${k}">${esc(l.replace(/ \(specify.*$/, ""))}</option>`));
    $("#f-own").insertAdjacentHTML("beforeend", `<option value="unknown">Not yet recorded</option>`);
    [...new Set(SITES.map(s => modelGroup(s.model)))].forEach(m => $("#f-model").insertAdjacentHTML("beforeend", `<option>${esc(m)}</option>`));
    cascade();
    $("#f-county").addEventListener("change", () => { $("#f-sub").value = ""; $("#f-fac").value = ""; cascade(); render(); });
    $("#f-sub").addEventListener("change", () => { $("#f-fac").value = ""; cascade(); render(); });
    ["#f-fac", "#f-level", "#f-own", "#f-model", "#f-src"].forEach(s => $(s).addEventListener("change", render));
    $("#f-pilot").addEventListener("change", () => { cascade(); render(); });
    $("#f-clear").addEventListener("click", () => { document.querySelectorAll(".filters select").forEach(x => x.value = ""); $("#f-pilot").value = "exclude"; cascade(); render(); });
    $("#reload").addEventListener("click", refresh);
    $("#logout").addEventListener("click", () => { try { sessionStorage.removeItem("dpr-session"); } catch (e) {} location.reload(); });
    try { const t = localStorage.getItem("dpr-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    $("#theme").addEventListener("click", () => {
      const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("dpr-theme", document.documentElement.dataset.theme); } catch (e) {}
      render();
    });
    startWithLogin();
  }
  function start() {
    $("#app").hidden = false;
    refresh();
    if (CFG.refreshMinutes > 0) setInterval(refresh, CFG.refreshMinutes * 60000);
  }

  // ---------------------------------------------------------------- login
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function unlock(password) {
    const A = CFG.auth, base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(A.salt), iterations: A.iterations, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(A.iv) }, key, b64(A.data));   // throws if password is wrong
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function startWithLogin() {
    if (!CFG.auth || !CFG.auth.data) { start(); return; }                      // no password set → open
    const KEY = "dpr-session";
    const ok = secret => { Object.assign(CFG, secret); $("#login").hidden = true; $("#app").hidden = false; $("#logout").hidden = false; start(); };
    try { const s = sessionStorage.getItem(KEY); if (s) { ok(JSON.parse(s)); return; } } catch (e) {}
    $("#app").hidden = true; $("#login").hidden = false; $("#pw").focus();
    $("#pw-show").addEventListener("click", () => { const i = $("#pw"); i.type = i.type === "password" ? "text" : "password"; $("#pw-show").textContent = i.type === "password" ? "Show" : "Hide"; });
    $("#login-form").addEventListener("submit", async ev => {
      ev.preventDefault(); $("#login-error").textContent = ""; $("#login-btn").disabled = true; $("#login-btn").textContent = "Checking…";
      try {
        const secret = await unlock($("#pw").value);
        try { sessionStorage.setItem(KEY, JSON.stringify(secret)); } catch (e) {}
        ok(secret);
      } catch (e) {
        $("#login-error").textContent = window.crypto && crypto.subtle ? "Incorrect password. Please try again." : "This browser cannot open the dashboard (use https and a current browser).";
        $("#pw").select();
      } finally { $("#login-btn").disabled = false; $("#login-btn").textContent = "Log in"; }
    });
  }
  init();
})();
</script>
</body>
